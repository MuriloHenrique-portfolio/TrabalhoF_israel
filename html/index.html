<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Cadastro e acesso - Segurança Física e Digital</title>
</head>
<body>
    <div class="cabecalho">
        <div class="logo"><p>Nome da empresa</p></div>
    </div>
    <div class="conteudo">
        <h1>Cadastro e acesso</h1>
        <div class="lista-blocos">
            <div class="bloco">
                <h2>Já tenho conta</h2>
                <label>E-mail<input type="email" placeholder="seuemail@exemplo.com"></label>
                <label>Senha<input type="password" placeholder="Sua senha"></label>
                <p><a class="botao" href="inicio.html">Entrar</a></p>
            </div>
            <div class="bloco">
                <h2>Criar conta</h2>
                <label>Nome<input type="text" placeholder="Seu nome"></label>
                <label>E-mail<input type="email" placeholder="seuemail@exemplo.com"></label>
                <label>Senha<input type="password" placeholder="Crie uma senha"></label>
                <a href="inicio.html">Cadastrar e entrar</a>
            </div>
        </div>
    </div>
    <div class="rodape">
        <p>Nome da empresa · Segurança física e digital.</p>
    </div>
</body>
</html>
