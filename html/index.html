<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Cadastro e acesso - Segurança Física e Digital</title>
</head>
<body>
    <div class="cabecalho">
        <div class="logo"><p>Segurança Integrada</p></div>
    </div>
    <main class="conteudo">
        <h1>Cadastro e acesso</h1>
        <p>Acesso demonstrativo. Use dados fictícios para testar os formulários.</p>
        <div class="lista-blocos">
            <form class="bloco" action="inicio.html" method="get" autocomplete="off">
                <h2>Já tenho conta</h2>
                <label>E-mail<input type="email" placeholder="voce@exemplo.com" required></label>
                <label>Senha de teste<input type="password" required></label>
                <button class="botao" type="submit">Entrar</button>
            </form>
            <form class="bloco" action="inicio.html" method="get" autocomplete="off">
                <h2>Criar conta</h2>
                <label>Nome<input type="text" maxlength="80" required></label>
                <label>E-mail<input type="email" placeholder="voce@exemplo.com" required></label>
                <label>Senha de teste (mínimo de 6 caracteres)<input type="password" minlength="6" required></label>
                <button class="botao" type="submit">Cadastrar e entrar</button>
            </form>
        </div>
    </main>
    <div class="rodape">
        <p>Segurança Integrada · Segurança física e digital.</p>
    </div>
</body>
</html>
